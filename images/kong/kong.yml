# Supabase API gateway routes for the Morphic Railway template.
#
# Derived from supabase/supabase docker/volumes/api/kong.yml, trimmed to what Morphic uses: Supabase
# Auth, and nothing else. Morphic keeps its data in its own database and calls Supabase only to sign
# people in, so REST, GraphQL, Storage, Realtime, Studio, pg-meta, Edge Functions, analytics and the
# dashboard basic-auth consumer are removed -- none of those services exist in this template, and a
# route to a service that is not there is an open door waiting for someone to add one.
#
# Upstream's hostname (auth:9999) is replaced by $AUTH_HOST, which the entrypoint fills from the
# environment, because on Railway the service answers at auth.railway.internal.

_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1-open
    url: http://$AUTH_HOST:9999/verify
    routes: [{ name: auth-v1-open, strip_path: true, paths: [/auth/v1/verify] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-callback
    url: http://$AUTH_HOST:9999/callback
    routes: [{ name: auth-v1-open-callback, strip_path: true, paths: [/auth/v1/callback] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-authorize
    url: http://$AUTH_HOST:9999/authorize
    routes: [{ name: auth-v1-open-authorize, strip_path: true, paths: [/auth/v1/authorize] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-jwks
    url: http://$AUTH_HOST:9999/.well-known/jwks.json
    routes: [{ name: auth-v1-open-jwks, strip_path: true, paths: [/auth/v1/.well-known/jwks.json] }]
    plugins: [{ name: cors }]

  - name: auth-v1
    url: http://$AUTH_HOST:9999/
    routes: [{ name: auth-v1-all, strip_path: true, paths: [/auth/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: request-transformer
        config:
          add: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
          replace: { headers: ["Authorization: $LUA_AUTH_EXPR"] }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
